# Add these locations inside the existing HTTPS server block for
# glavasengineering.com. Keep the SSL and redirect configuration already
# managed by Certbot.

# Astro's generated assets are fingerprinted and safe to cache for a year.
location /_astro/ {
  add_header Cache-Control "public, max-age=31536000, immutable";
}

# The self-hosted font is versioned by this project and safe to cache long-term.
location = /fonts/inter-latin.woff2 {
  add_header Cache-Control "public, max-age=31536000, immutable";
}

# Project images and other public assets may be replaced without a new URL,
# so cache them for one week rather than marking them immutable.
location ~* \.(?:svg|jpg|jpeg|png|webp|avif|gif|ico)$ {
  add_header Cache-Control "public, max-age=604800";
}

# HTML and SEO files should be checked after deployments.
location ~* \.(?:html|xml|txt)$ {
  add_header Cache-Control "public, max-age=0, must-revalidate";
}
